<script>
const R=['مدير التسويق الإلكتروني','المصور (Photographer)','Media Buyer','Online Seller','موظف تغطية الفروع'];
const TS=['لم تبدأ','قيد التنفيذ','مكتملة','مكتملة جزئيًا','متأخرة','متوقفة','ملغاة'],PRI=['عالية','متوسطة','منخفضة'],PD={عالية:'🔴',متوسطة:'🟡',منخفضة:'🟢'};
const NS=['مفتوحة','قيد المتابعة','تم الحل','متكررة','تحتاج قرار إداري'],NT=['جودة','تأخير','التزام بالإجراءات','تواصل','أخرى'];
const REA=['معوق من الشركة','انتظار موافقة','انتظار العميل','انتظار قسم آخر','مشكلة تقنية','نقص موارد','سبب آخر','تقصير الموظف'];
const KPI={[R[1]]:['سيارات مصوّرة','Before/After','صور Google Maps','محتوى Snapchat','فيديوهات خدمات','Stories','مقابلات عملاء','جودة الصور (1-5)','جودة الفيديو (1-5)','الالتزام بخطة التصوير (1-5)','ملفات مسلّمة'],
[R[2]]:['حملات مطلقة','حملات محسّنة','مراقبة الميزانية (1-5)','CPL','Leads','Conversion %','جودة العملاء (1-5)','تقارير مسلّمة','مشاكل عولجت','الالتزام بالخطة (1-5)'],
[R[3]]:['عملاء متابَعون','عملاء مؤهلون','حجوزات','مبيعات','تحديثات CRM','إغلاق %','زمن الرد (دقيقة)','الالتزام بالرسائل (1-5)'],
[R[4]]:['تغطيات','فروع مغطاة','جودة المحتوى (1-5)','مواد مرسلة في الموعد','تنوع المحتوى (1-5)','الالتزام بالتوجيهات (1-5)']};
const avgK=k=>/%|CPL|\(1-5\)|زمن/.test(k);
const L={date:'التاريخ',emp:'الموظف',title:'المهمة',desc:'الوصف',pri:'الأولوية',due:'الموعد',status:'الحالة',pct:'الإنجاز',quality:'الجودة',empNote:'ملاحظة الموظف',block:'المعوقات',mgrNote:'ملاحظة المدير',action:'الإجراء',follow:'تاريخ المتابعة',fstatus:'حالة المتابعة',reason:'سبب عدم الإنجاز',owner:'المسؤول',imp:'الأهمية',type:'النوع'};
const iso=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return x.toISOString().slice(0,10)};
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const today=iso(new Date());
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='mkt_perf_v1';let FULL,S,ME=null,V='dash',CUR='',M={},armed='',F={date:'',emp:'',role:'',status:'',pri:'',q:'',ns:''},DD=today;
function demo(){let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
const emps=[['e1','أحمد',R[1]],['e2','محمد',R[2]],['e3','خالد',R[3]],['e4','سامي',R[4]]].map(([id,name,role])=>({id,name,role,start:addD(today,-30)}));
const T={e1:['تصوير سيارات الصباح','Before/After لخدمة التلميع','فيديو خدمة جديدة'],e2:['مراجعة الحملات','تحسين الإعلانات','تقرير الميزانية'],e3:['متابعة العملاء','تحديث CRM','الرد على الاستفسارات'],e4:['تغطية فرع','إرسال مواد التغطية','محتوى فرع']};
const tasks=[],rat={},kp={};let n=0;
for(let d=6;d>=0;d--){const date=addD(today,-d);emps.forEach(e=>{
for(let k=0;k<2;k++){const x=rnd();let status,pct,q=0,reason='';
if(d==0){if(k==0){if(x<.5){status='مكتملة';pct=100;q=4}else{status='قيد التنفيذ';pct=60}}else{status='لم تبدأ';pct=0}}
else if(x<.65){status='مكتملة';pct=100;q=3+Math.round(rnd()*2)}else if(x<.85){status='مكتملة جزئيًا';pct=60;q=3}else{status='متأخرة';pct=20;reason=['انتظار موافقة','تقصير الموظف','مشكلة تقنية'][Math.floor(rnd()*3)]}
tasks.push({id:'t'+(n++),date,emp:e.id,title:T[e.id][(k+d)%3],desc:'',pri:PRI[Math.floor(rnd()*3)],due:date,status,pct,quality:q,empNote:'',block:'',mgrNote:'',action:'',follow:'',fstatus:'لا يوجد',reason})}
rat[date+'|'+e.id]={time:3+Math.round(rnd()*2),proc:3+Math.round(rnd()*2),init:3+Math.round(rnd()*2)};
const o={};(KPI[e.role]||[]).forEach(k=>o[k]=/\(1-5\)/.test(k)?3+Math.round(rnd()*2):Math.round(rnd()*10));kp[date+'|'+e.id]=o})}
const notes=[{id:'n1',emp:'e1',date:addD(today,-5),type:'جودة',desc:'إضاءة غير كافية في بعض اللقطات',imp:'متوسطة',action:'مراجعة إعدادات الإضاءة',owner:'المدير',follow:addD(today,-2),status:'مفتوحة'},
{id:'n2',emp:'e1',date:addD(today,-2),type:'جودة',desc:'تكرار نفس مشكلة الإضاءة',imp:'عالية',action:'جلسة تدريب قصيرة',owner:'المدير',follow:today,status:'متكررة'},
{id:'n3',emp:'e3',date:addD(today,-3),type:'تأخير',desc:'تأخر في تحديث CRM',imp:'متوسطة',action:'تحديث يومي قبل الإغلاق',owner:'خالد',follow:addD(today,2),status:'قيد المتابعة'},
{id:'n4',emp:'e2',date:addD(today,-4),type:'التزام بالإجراءات',desc:'تقرير الميزانية بدون صيغة موحدة',imp:'منخفضة',action:'اعتماد قالب موحد',owner:'محمد',follow:addD(today,-1),status:'تم الحل'}];
return{demo:1,emps,tasks,notes,rat,kp,log:[{t:new Date().toISOString(),txt:'تحميل البيانات التجريبية'}]}}
try{FULL=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!FULL||!FULL.emps)FULL=demo();S=FULL;
function save(){try{localStorage.setItem(KEY,JSON.stringify(FULL))}catch(e){}}
function log(txt){FULL.log.unshift({t:new Date().toISOString(),by:ME?ME.name:'النظام',txt});FULL.log=FULL.log.slice(0,200)}
function toast(m){const t=$('#toast');t.textContent=m;setTimeout(()=>t.textContent='',2200)}
const emp=id=>S.emps.find(x=>x.id==id),nm=id=>emp(id)?emp(id).name:'—';
const ext=t=>t.status!='مكتملة'&&(t.status=='ملغاة'||(t.reason&&t.reason!='تقصير الموظف'));
const isLate=t=>t.status!='مكتملة'&&t.status!='ملغاة'&&(t.status=='متأخرة'||(t.due&&t.due<today));
const nLate=n=>n.status!='تم الحل'&&n.follow&&n.follow<today;
const rng=(end,n)=>[...Array(n)].map((_,i)=>addD(end,-(n-1-i)));
function dayScore(id,date){const ts=S.tasks.filter(t=>t.emp==id&&t.date==date);if(!ts.length)return null;
const ct=ts.filter(t=>!ext(t)),comp=ct.length?ct.reduce((a,t)=>a+t.pct,0)/ct.length:100,qs=ts.filter(t=>t.quality),q=qs.length?qs.reduce((a,t)=>a+t.quality,0)/qs.length:3,r=S.rat[date+'|'+id]||{};
return Math.round(comp*.4+q/5*25+(r.time||3)/5*15+(r.proc||3)/5*10+(r.init||3)/5*10)}
function avgS(id,ds){const v=ds.map(d=>dayScore(id,d)).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b)/v.length):null}
function stat(id,ds){const ts=S.tasks.filter(t=>t.emp==id&&ds.includes(t.date)),ct=ts.filter(t=>!ext(t));
return{n:ts.length,done:ts.filter(t=>t.status=='مكتملة').length,late:ts.filter(t=>isLate(t)&&!ext(t)).length,ext:ts.filter(ext).length,comp:ct.length?Math.round(ct.reduce((a,t)=>a+t.pct,0)/ct.length):null,score:avgS(id,ds),
notes:S.notes.filter(n=>n.emp==id&&ds.includes(n.date)).length,open:S.notes.filter(n=>n.emp==id&&n.status!='تم الحل').length,rep:repN(id)}}
function repN(id){const c={};S.notes.filter(n=>n.emp==id).forEach(n=>c[n.type]=(c[n.type]||0)+1);return Object.values(c).filter(v=>v>1).length+S.notes.filter(n=>n.emp==id&&n.status=='متكررة'&&c[n.type]<2).length}
const lvl=s=>s==null?['⚪','لا بيانات']:s>=85?['🟢','ممتاز']:s>=70?['🔵','جيد جدًا']:s>=55?['🟡','يحتاج متابعة']:['🔴','يحتاج تدخل'];
const bd=s=>{const l=lvl(s);return`<span class="tag">${l[0]} ${l[1]}</span>`};
const v=x=>x==null?'—':x,pc=x=>x==null?'—':x+'%';
const op=(a,val,ph)=>(ph!==undefined?`<option value="">${ph}</option>`:'')+a.map(x=>{const[k,l]=Array.isArray(x)?x:[x,x];return`<option value="${esc(k)}"${k==val?' selected':''}>${esc(l)}</option>`}).join('');
const EO=()=>S.emps.map(e=>[e.id,e.name+' – '+e.role]);
const PAL=['#8b5cf6','#f5c542','#34d399','#60a5fa','#f87171','#f472b6'];
function chart(ser,labels){const W=600,H=200,p=28,x=i=>p+i*(W-2*p)/Math.max(1,labels.length-1),y=v=>H-p-v*(H-2*p)/100;
let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" direction="ltr">`;
[0,50,100].forEach(g=>s+=`<line x1="${p}" x2="${W-p}" y1="${y(g)}" y2="${y(g)}" stroke="#33334a"/><text x="2" y="${y(g)+4}" fill="#9a98ab" font-size="10">${g}</text>`);
labels.forEach((l,i)=>{if(labels.length<=10||i%3==0)s+=`<text x="${x(i)}" y="${H-8}" fill="#9a98ab" font-size="9" text-anchor="middle">${l.slice(5)}</text>`});
ser.forEach(a=>{let d='',pen=0;a.data.forEach((val,i)=>{if(val==null){pen=0;return}d+=(pen?'L':'M')+x(i)+' '+y(val);pen=1});s+=`<path d="${d}" fill="none" stroke="${a.c}" stroke-width="2"/>`;a.data.forEach((val,i)=>{if(val!=null)s+=`<circle cx="${x(i)}" cy="${y(val)}" r="3" fill="${a.c}"/>`})});
return s+'</svg><div class="ch">'+ser.map(a=>`<span class="tag" style="color:${a.c}">● ${esc(a.n)}</span>`).join('')+'</div>'}
function alerts(){const A=[];
S.tasks.filter(t=>isLate(t)&&!ext(t)).slice(0,6).forEach(t=>A.push(['','⏰ مهمة متأخرة: '+t.title+' ('+nm(t.emp)+')']));

S.notes.filter(n=>n.follow==today&&n.status!='تم الحل').forEach(n=>A.push(['y','📅 متابعة مستحقة اليوم: '+n.action+' ('+nm(n.emp)+')']));
S.tasks.filter(t=>t.follow==today&&t.fstatus=='مطلوبة').forEach(t=>A.push(['y','📅 متابعة مهمة اليوم: '+t.title]));
S.emps.forEach(e=>{if(repN(e.id))A.push(['y','🔁 تكرار ملاحظات: '+e.name]);const s=avgS(e.id,rng(today,7));if(s!=null&&s<55)A.push(['','📉 انخفاض أداء: '+e.name+' ('+s+')'])});
S.tasks.filter(t=>t.pri=='عالية'&&t.status!='مكتملة'&&t.status!='ملغاة'&&t.date==today).forEach(t=>A.push(['','🔴 مهمة عالية الأولوية لم تنجز: '+t.title+' ('+nm(t.emp)+')']));return A}

const taskRow=t=>`<tr><td>${t.date}</td><td><a onclick="go('prof','${t.emp}')">${nm(t.emp)}</a></td><td>${esc(t.title)}${t.branch?`<div class="mu">${t.branch} · ${esc(tyStr(t))}${t.t1?' · '+t.t1+(t.t2?'–'+t.t2:''):''}</div>`:''}</td><td>${PD[t.pri]} ${t.pri}</td><td>${t.due||''}</td><td>${t.status}${isLate(t)?' ⏰':''}</td><td><div class="bar"><i style="width:${t.pct}%"></i></div>${t.pct}%</td><td>${t.quality||'—'}</td><td class="mu">${ext(t)?'🔧 '+(t.reason||'ملغاة'):t.reason?'⚠ '+t.reason:''}</td><td><button class="btn sm" onclick="openTask('${t.id}')">✎</button> ${t.status!='مكتملة'?`<button class="btn sm" onclick="doneT('${t.id}')">✔</button>`:''}</td></tr>`;
const taskTbl=a=>a.length?`<div class="w"><table><tr><th>التاريخ</th><th>الموظف</th><th>المهمة</th><th>الأولوية</th><th>الموعد</th><th>الحالة</th><th>الإنجاز</th><th>الجودة</th><th>السبب</th><th></th></tr>${a.map(taskRow).join('')}</table></div>`:'<div class="mu">لا توجد مهام</div>';

function mkDb(sb){const LS=[];let chan=null;const direct=(b,p)=>p.startsWith(b+'/')&&!p.slice(b.length+1).includes('/'),mk=(p,d)=>({id:p.split('/').pop(),data:()=>d}),snap=ch=>({docChanges:()=>ch,metadata:{fromCache:false},docs:[],size:ch.length,empty:!ch.length});
const ensure=()=>{if(chan)return;chan=sb.channel('docs-all').on('postgres_changes',{event:'*',schema:'public',table:'docs'},pl=>{const del=pl.eventType=='DELETE',row=del?pl.old:pl.new;if(!row||!row.path)return;LS.forEach(l=>{if(!direct(l.base,row.path))return;let ch;if(del){l.ids.delete(row.path);ch=[{type:'removed',doc:mk(row.path,null)}]}else{ch=[{type:l.ids.has(row.path)?'modified':'added',doc:mk(row.path,row.data)}];l.ids.add(row.path)}l.next(snap(ch))})}).subscribe()};
return{collection:base=>({onSnapshot(next,err){const l={base,ids:new Set(),next};LS.push(l);ensure();(async()=>{const rows=[];for(let a=0;;a+=1000){const r=await sb.from('docs').select('path,data').like('path',base+'/%').range(a,a+999);if(r.error){err&&err(r.error);return}rows.push(...r.data);if(r.data.length<1000)break}
const ch=rows.filter(r=>direct(base,r.path)).map(r=>{l.ids.add(r.path);return{type:'added',doc:mk(r.path,r.data)}});next(snap(ch))})();return()=>{const i=LS.indexOf(l);if(i>=0)LS.splice(i,1)}}}),
doc:p=>({set:async d=>{const r=await sb.from('docs').upsert({path:p,data:d,updated_at:new Date().toISOString()});if(r.error)throw r.error},delete:async()=>{const r=await sb.from('docs').delete().eq('path',p);if(r.error)throw r.error}})}}
async function boot(){if(window.__b)return;window.__b=1;FULL={emps:[],tasks:[],notes:[],rat:{},kp:{},log:[],users:[],clients:[],demo:0};S=FULL;
const C=window.APP_CONFIG||{};if(!C.SUPABASE_URL||/PASTE|ضع/.test(C.SUPABASE_URL)||!C.SUPABASE_ANON_KEY||!window.supabase){STATE='cfg';render();return}
SB=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
const{data}=await SB.auth.getSession();SB.auth.onAuthStateChange(ev=>{if(ev=='SIGNED_OUT'&&MYID)location.reload()});
if(!data||!data.session){STATE='login';render();return}
const u=data.session.user;MYID=u.id;MYEMAIL=u.email||'';STATE='load';render();
const r=await SB.from('app_roles').select('role,active').eq('uid',MYID).maybeSingle();
if(r.error||!r.data){STATE='noaccess';render();return}
if(!r.data.active){STATE='off';render();return}
ROLE=r.data.role;ISOWN=ROLE=='admin';ISADM=ROLE=='admin'||ROLE=='executive';DB=mkDb(SB);
if(ISADM){['a/s/emps','a/s/links','a/s/meta','a/s/alog'].forEach(sub)}else{sub('mgr/'+MYID+'/items');sub('emp/'+MYID+'/items')}}
loginHtml=()=>{const c=(t,m,x)=>`<div class="card" style="max-width:480px;margin:30px auto"><h3>${t}</h3><div class="mu">${m}</div>${x||''}</div>`;
if(STATE=='login')return`<div class="card" style="max-width:380px;margin:30px auto"><h3>تسجيل الدخول</h3><div class="f" style="grid-template-columns:1fr"><label>البريد الإلكتروني<input id="lu" type="email" dir="ltr" autocomplete="username"></label><label>كلمة المرور<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"></label></div><div id="le" class="al" style="display:none;margin-top:10px"></div><button class="btn gd" style="margin-top:10px;width:100%" onclick="login()">تسجيل الدخول</button><div class="mu" style="margin-top:8px">الحسابات يُنشئها مدير النظام.</div></div>`;
const out='<div class="fl" style="margin-top:12px"><button class="btn" onclick="logout()">تسجيل الخروج</button></div>';
return STATE=='cfg'?c('الإعداد غير مكتمل','افتح ملف index.html واكتب رابط مشروع Supabase والمفتاح العام في قسم الإعدادات أعلى الملف (انظر ملف التعليمات).'):STATE=='noaccess'?c('حسابك غير مفعّل للنظام','سُجّل دخولك بنجاح لكن لم يمنحك المدير صلاحية بعد. اطلب منه تفعيل حسابك ثم أعد تحميل الصفحة.',out):STATE=='off'?c('الحساب معطّل','تواصل مع مدير النظام.',out):STATE=='pending'?c('حسابك غير مربوط بعد',ISADM?'بانتظار تهيئة النظام أو ربط حسابك من إدارة المستخدمين.':'سيربط المدير حسابك بالموظف المناسب ثم تُحدَّث الصفحة تلقائيًا.',out):STATE=='first'?c('تهيئة النظام لأول مرة','هذه أول مرة يُفتح فيها النظام. اختر طريقة البدء:','<div class="fl" style="margin-top:12px"><button class="btn gd" onclick="bootstrap(false)">البدء فارغًا (للاستخدام الفعلي)</button><button class="btn" onclick="bootstrap(true)">ببيانات تجريبية (للتجربة)</button></div>'):c('جارٍ التحميل...','يتم الاتصال بقاعدة البيانات')};
async function login(){const e=$('#lu').value.trim(),p=$('#lp').value;const r=await SB.auth.signInWithPassword({email:e,password:p});if(r.error){const x=$('#le');x.style.display='block';x.textContent='بيانات الدخول غير صحيحة';return}location.reload()}
async function logout(){try{await SB.auth.signOut()}catch(e){}location.reload()}
function openPw2(){mod(`<h3>تغيير كلمة المرور</h3><div class="f">${fv('npw','كلمة المرور الجديدة (8 أحرف فأكثر)','','password')}</div><div class="fl" style="margin-top:12px"><button class="btn gd" onclick="savePw2()">حفظ</button><button class="btn" onclick="close_()">إلغاء</button></div>`)}
async function savePw2(){const p=$('#m_npw').value;if(p.length<8)return toast('كلمة المرور قصيرة');const r=await SB.auth.updateUser({password:p});if(r.error)return toast('تعذر التغيير');close_();toast('تم تغيير كلمة المرور')}
const emailOf=id=>(PROFS.find(p=>p.uid==id)||{}).email||'';
function loadProfs(){if(!SB||!ISOWN)return;SB.from('app_profiles').select('uid,email').then(r=>{PROFS=r.data||[];PROFS_LOADED=true;render()})}
VW.users=()=>{if(!PROFS_LOADED){PROFS_LOADED=true;loadProfs()}const free=PROFS.filter(p=>!FULL.users.some(u=>u.id==p.uid));
return`<div class="fl"><h3 style="margin:0">إدارة المستخدمين</h3><button class="btn" onclick="PROFS_LOADED=false;render()">تحديث القائمة</button></div>
<div class="demo">لإضافة شخص جديد: أنشئ له حسابًا (بريد + كلمة مرور) من لوحة Supabase ← Authentication ← Users ← Add user، ثم حدّث القائمة هنا واضغط «ربط» بجانب بريده لتحدد دوره وموظفه. المدير التنفيذي (Executive) يقرأ فقط على مستوى الخادم، ولمنحه صلاحية تعديل اجعله Admin.</div>
<div class="card"><div class="w"><table><tr><th>الاسم</th><th>البريد</th><th>Role</th><th>الموظف</th><th>الحالة</th><th>الإجراءات</th></tr>${FULL.users.map(u=>`<tr><td>${esc(u.name)}</td><td dir="ltr">${esc(emailOf(u.id))}</td><td>${u.role}${u.role=='employee'?[(u.perms||{}).notes?'ملاحظات':'',(u.perms||{}).rate?'تقييم':'',(u.perms||{}).addTask?'مهام':''].filter(Boolean).map(x=>` <span class="tag">${x}</span>`).join(''):''}</td><td>${u.empId?esc(nm(u.empId)):'—'}</td><td>${u.active?'🟢 نشط':'⚪ معطّل'}</td><td><button class="btn sm" onclick="openUser('${u.id}')">تعديل</button> <button class="btn sm" onclick="togU('${u.id}')">${u.active?'تعطيل':'تفعيل'}</button></td></tr>`).join('')}</table></div></div>
<div class="card"><h3>حسابات أُنشئت ولم تُربط بعد</h3>${free.length?free.map(p=>`<div class="fl"><span dir="ltr">${esc(p.email||p.uid)}</span><button class="btn sm gd" onclick="openUser(null,{id:'${esc(p.uid)}',name:'${esc(String(p.email||'').split('@')[0].replace(/'/g,''))}'})">ربط</button></div>`).join(''):'<div class="mu">لا توجد حسابات جديدة</div>'}</div>`};
function openUser(id,np){const u=id&&FULL.users.find(x=>x.id==id);UM={id:u?u.id:np.id,active:u?u.active:true};const d=u||{name:np.name||'',role:'employee',empId:'',perms:{notes:true,rate:true,addTask:true}};
mod(`<h3>${u?'تعديل':'ربط'} مستخدم</h3><div class="mu" dir="ltr">${esc(emailOf(UM.id))}</div><div class="f">${fv('name','الاسم المعروض',d.name)}<label>Role<select id="m_role">${op([['admin','Admin – مدير النظام'],['employee','Employee – موظف'],['executive','Executive – قراءة فقط']],d.role)}</select></label><label>الموظف المرتبط<select id="m_empId">${op(EO(),d.empId,'— بدون —')}</select></label><div class="full" style="border:1px solid var(--bd);border-radius:8px;padding:8px"><b>صلاحيات الموظف</b><br><label><input type="checkbox" id="m_pn" ${(d.perms||{}).notes?'checked':''}> يضيف ملاحظات</label><label><input type="checkbox" id="m_pr" ${(d.perms||{}).rate?'checked':''}> يعبّئ تقييمات ومؤشرات تقريره</label><label><input type="checkbox" id="m_pa" ${(d.perms||{}).addTask?'checked':''}> يضيف مهام لنفسه</label></div></div><div class="fl" style="margin-top:12px"><button class="btn gd" onclick="saveUser()">حفظ</button><button class="btn" onclick="close_()">إلغاء</button></div>`)}
async function saveUser(){const g=k=>$('#m_'+k).value.trim(),n={id:UM.id,name:g('name'),role:g('role'),empId:g('empId'),canEdit:false,perms:{notes:$('#m_pn').checked,rate:$('#m_pr').checked,addTask:$('#m_pa').checked},active:UM.active};
if(!n.name)return toast('أدخل الاسم');if(n.id==MYID&&n.role!='admin')return toast('لا يمكنك تغيير دور حسابك');
if(n.role=='employee'){if(!n.empId)return toast('اربط الحساب بموظف');const e=emp(n.empId);if(!e)return toast('الموظف غير موجود');if(e.uid&&e.uid!=n.id)return toast('هذا الموظف مربوط بحساب آخر')}else n.empId='';
const r=await SB.from('app_roles').upsert({uid:n.id,role:n.role,active:n.active});if(r.error)return toast('تعذر حفظ الدور على الخادم');
FULL.emps.forEach(e=>{if(e.uid==n.id&&e.id!=n.empId)delete e.uid});if(n.empId)emp(n.empId).uid=n.id;
const i=FULL.users.findIndex(x=>x.id==n.id);if(i>=0)FULL.users[i]=n;else FULL.users.push(n);log('ربط/تعديل مستخدم: '+n.name);fin()}
async function togU(id){const u=FULL.users.find(x=>x.id==id);if(!u)return;if(u.id==MYID)return toast('لا يمكن تعطيل حسابك');const a=!u.active,r=await SB.from('app_roles').update({active:a}).eq('uid',id);if(r.error)return toast('تعذر التغيير على الخادم');u.active=a;log((a?'فعّل ':'عطّل ')+'المستخدم '+u.name);save();render()}

boot();

</script></body></html>
